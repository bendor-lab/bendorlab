# Publication list settings.
#
# The site finds papers automatically every week from three places:
#   1. your ORCID record (orcid below)
#   2. Crossref works that carry your ORCID iD
#   3. a PubMed search (pubmed_query below)
# Full details for each paper (authors, journal, volume, pages) come from Crossref.
#
# "include" guarantees a paper appears and sets which section it goes in.
# A DOI is enough; any other field you fill in overrides what Crossref says.
# "exclude" hides a paper even if a database lists it.

orcid: 0000-0001-6621-793X
pubmed_query: 'Bendor D[Author] AND ("University College London"[Affiliation] OR UCL[Affiliation])'

# Author names to show in bold (as they appear in the list: surname then initials)
highlight:
  - Bendor D

# Order of sections on the Publications page
sections:
  - Peer-reviewed articles
  - Preprints
  - Commentary
  - Book chapters

