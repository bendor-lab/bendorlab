intro: >-
  We use behavioural, computational, electrophysiological, and molecular-genetic
  tools to study how the neocortex and hippocampus encode information and
  communicate with each other, with a goal to understand the neural mechanisms
  responsible for memory, perception, predictive coding and more broadly the
  functional role of sleep.

# The figure shown on the home page, below the introduction.
home_figure:
  image: /static/images/research/replay-events-tirole-2022.webp
  alt: >-
    Spike rasters and decoded position for hippocampal place cells while a rat runs
    two tracks, and two replay events during rest afterwards.
  caption: >-
    Place cells recorded while a rat ran laps on two tracks, and two replay events
    during rest afterwards. In each event the cells fire in the order they did on
    one track, compressed into about 200 ms.
  credit: Adapted from Tirole, Huelin Gorriz et al. (2022), eLife 11:e79031, CC BY 4.0
