intro: >-
  We use behavioural, computational, electrophysiological, and molecular-genetic
  tools to study how the neocortex and hippocampus encode information and
  communicate with each other, with a goal to understand the neural mechanisms
  responsible for memory, perception, predictive coding and more broadly the
  functional role of sleep.

