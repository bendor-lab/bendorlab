intro: >-
  We use behavioural, computational, electrophysiological and molecular-genetic tools
  to study how the neocortex and hippocampus encode information and communicate with
  each other. Our goal is to understand the neural mechanisms of memory, perception
  and predictive coding, and the functional role of sleep.

