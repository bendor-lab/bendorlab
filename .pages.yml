# Pages CMS configuration: gives the website's content an editing form at https://app.pagescms.org
# Each save is committed to the repository and the site rebuilds itself within a couple of minutes.

media:
  input: static/images
  output: /static/images
  extensions: [jpg, jpeg, png, webp]

content:
  - name: people
    label: People
    type: file
    path: data/people.yml
    format: yaml
    fields:
      - name: members
        label: Current lab members
        description: Shown in this order. Drag to reorder.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}, {role}"
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: role, label: Role, type: string, description: "For example: PhD student, Research fellow" }
          - { name: fellowship, label: Fellowship or award (optional), type: string, description: "Shown under the role, e.g. RNID Fellowship" }
          - name: photo
            label: Photo
            description: A portrait photo works best (it is cropped to 4:5). Leave empty to show initials.
            type: image
            options: { path: static/images/people }
          - { name: interests, label: Research interests (one line, optional), type: string }
          - { name: orcid, label: "ORCID iD (optional, e.g. 0000-0001-6621-793X)", type: string }
          - { name: scholar, label: Google Scholar link (optional), type: string }
          - { name: link, label: Personal web page (optional), type: string }
      - name: alumni_groups
        label: Alumni headings (in the order shown)
        type: string
        list: true
      - name: alumni
        label: Lab alumni
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} ({group})"
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: years, label: Years in the lab, type: string, description: "For example: 2017–2021" }
          - { name: now, label: Where they are now, type: string }
          - name: group
            label: Heading
            type: select
            options:
              values: [Postdoctoral fellows, Research assistants, PhD students, "MSc, MRes and visiting students"]

  - name: news
    label: News
    type: file
    path: data/news.yml
    format: yaml
    fields:
      - name: items
        label: News items
        description: The four most recent appear on the home page; all appear on the News page.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{date}: {text}"
        fields:
          - { name: date, label: Date, type: date, required: true, description: Shown as month and year. }
          - { name: text, label: Text, type: text, required: true, description: "One or two sentences, e.g. Aditi Bishnoi has been awarded a Marie Skłodowska-Curie Postdoctoral Fellowship." }
          - { name: link, label: Link (optional), type: string }
          - { name: link_text, label: "Link text (optional, e.g. Read the paper)", type: string }

  - name: publications
    label: Publications
    type: file
    path: data/publications.yml
    format: yaml
    fields:
      - name: include
        label: Papers to always list
        description: A DOI is enough. Any other field you fill in replaces what Crossref says.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{doi}{title} ({section})"
        fields:
          - { name: doi, label: DOI, type: string, description: "For example: 10.1038/nn.3203" }
          - name: section
            label: Section
            type: select
            options:
              values: [Peer-reviewed articles, Reviews, Preprints, Commentary, Book chapters]
          - { name: title, label: Title (optional override), type: string }
          - { name: authors, label: "Authors (optional override, e.g. Bendor D, Wilson MA)", type: string }
          - { name: venue, label: Journal or book (optional override), type: string }
          - { name: year, label: Year (needed only if there is no DOI), type: number }
      - name: exclude
        label: Papers to hide
        description: Hide anything the databases list that should not appear.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{doi}"
        fields:
          - { name: doi, label: DOI, type: string }
      - name: highlight
        label: Names shown in bold
        description: As they appear in the list, surname then initials.
        type: string
        list: true
      - name: sections
        label: Section order
        type: string
        list: true
      - { name: orcid, label: ORCID iD, type: string }
      - { name: pubmed_query, label: PubMed search, type: string }

  - name: research
    label: Research
    type: file
    path: data/research.yml
    format: yaml
    fields:
      - { name: intro, label: Introduction (also shown on the home page), type: text }
      - name: home_figure
        label: Home page figure
        description: Use figures from papers with a CC BY licence and keep the credit line.
        type: object
        fields:
          - name: image
            label: Image
            type: image
            options: { path: static/images/research }
          - { name: alt, label: Description for screen readers, type: text }
          - { name: caption, label: Caption, type: text }
          - { name: credit, label: Credit line, type: string }
          - { name: credit_url, label: Credit link (DOI), type: string }
      - name: themes
        label: Research themes
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Theme, type: string, required: true }
          - { name: summary, label: Short description (optional), type: text }
          - name: image
            label: Figure (optional)
            type: image
            options: { path: static/images/research }
          - { name: image_alt, label: Figure description for screen readers, type: text }
          - { name: caption, label: Figure caption, type: text }
          - { name: credit, label: Figure credit line, type: string }
          - { name: credit_url, label: Figure credit link (DOI), type: string }
          - name: more_figures
            label: More figures (optional)
            description: Shown in order after the first figure.
            type: object
            list: true
            fields:
              - name: image
                label: Figure
                type: image
                options: { path: static/images/research }
              - { name: image_alt, label: Figure description for screen readers, type: text }
              - { name: caption, label: Figure caption, type: text }
              - { name: credit, label: Figure credit line, type: string }
              - { name: credit_url, label: Figure credit link (DOI), type: string }
          - name: papers
            label: Selected papers (DOIs)
            description: Each DOI must also be in the publication list; the full citation is filled in automatically.
            type: string
            list: true

  - name: positions
    label: Join the lab
    type: file
    path: data/positions.yml
    format: yaml
    fields:
      - { name: intro, label: Introduction (also shown on the home page), type: text }
      - { name: how_to_apply, label: How to get in touch, type: text }
      - { name: contact_email, label: Contact email, type: string }
      - { name: routes_intro, label: Routes into the lab (introduction), type: text }
      - name: routes
        label: Routes into the lab
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{label}"
        fields:
          - { name: label, label: Programme, type: string }
          - { name: note, label: Note, type: string }
          - { name: url, label: Link, type: string }
      - name: openings
        label: Funded vacancies
        description: Leave empty when there are none.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - { name: title, label: Title, type: string, required: true }
          - { name: summary, label: Summary, type: text }
          - { name: details, label: Details (optional), type: text }
          - { name: closing_date, label: Closing date (optional), type: string }
          - { name: link, label: Link to full advert (optional), type: string }

  - name: code
    label: Code and data
    type: file
    path: data/code.yml
    format: yaml
    fields:
      - { name: intro, label: Introduction, type: text }
      - { name: github_org, label: GitHub organisation, type: string }
      - { name: list_other_repositories, label: Also list the organisation's other public repositories, type: boolean }
      - { name: hide_repositories, label: Repositories not to list automatically, type: string, list: true }
      - name: entries
        label: Papers with code or data
        description: One entry per paper; the DOI must be in the publication list.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{doi}"
        fields:
          - { name: doi, label: DOI of the paper, type: string }
          - name: links
            label: Links
            type: object
            list: true
            fields:
              - { name: label, label: "Label (e.g. Analysis code, Data (Dryad))", type: string }
              - { name: url, label: Link, type: string }
          - { name: note, label: Note (optional), type: text }

  - name: photos
    label: Photos
    type: file
    path: data/photos.yml
    format: yaml
    fields:
      - name: photos
        label: Lab photos (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption}"
        fields:
          - name: image
            label: Photo
            type: image
            options: { path: static/images/photos }
          - { name: caption, label: Caption, type: string }
          - { name: alt, label: Description for screen readers, type: string, description: "For example: Lab members at lunch by a lake, 2025" }

  - name: site
    label: Site settings
    type: file
    path: data/site.yml
    format: yaml
    fields:
      - { name: title, label: Lab name, type: string }
      - { name: url, label: Website address, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: institute, label: Institute, type: string }
      - { name: department, label: Department, type: string }
      - { name: university, label: University, type: string }
      - { name: email, label: Contact email, type: string }
      - { name: address, label: Postal address (one line each), type: string, list: true }
      - { name: orcid, label: ORCID iD, type: string }
      - name: hero_image
        label: Home page photo
        type: image
        options: { path: static/images/photos }
      - { name: hero_alt, label: Home page photo description, type: string }
      - name: social_image
        label: Picture for social media previews
        description: Shown when a link to the site is shared. 1200 x 630 pixels works best.
        type: image
        options: { path: static/images }
      - { name: institute_page, label: Institute page link (optional), type: string }
      - { name: github, label: GitHub link (optional), type: string }
      - { name: google_scholar, label: Google Scholar link (optional), type: string }
      - { name: ucl_profile, label: UCL profile link (optional), type: string }
      - { name: bluesky, label: Bluesky link (optional), type: string }
      - name: google_site_verification
        label: Google Search Console code (optional)
        description: The content value of the HTML tag that Search Console gives you.
        type: string
      - name: goatcounter
        label: GoatCounter site code (optional)
        description: For visitor counts. The code chosen at goatcounter.com, e.g. bendorlab. Leave empty to switch counting off.
        type: string
